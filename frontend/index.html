<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Portal Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>

<body class="bg-slate-50 min-h-screen text-slate-900 flex items-center justify-center p-4">

    <div class="max-w-md w-full glass rounded-3xl shadow-2xl border border-white p-8">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4 shadow-lg shadow-indigo-200">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                    </path>
                </svg>
            </div>

            <h1 class="text-3xl font-bold text-slate-800">
                Campus Access
            </h1>

            <p class="text-slate-500 mt-2">
                Identify your role to continue
            </p>
        </div>

        <!-- Role Tabs -->
        <div class="flex p-1 bg-slate-100 rounded-xl mb-6">

            <button
                onclick="setRole('student')"
                id="tab-student"
                type="button"
                class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all role-tab bg-white shadow-sm text-indigo-600">
                Student
            </button>

            <button
                onclick="setRole('guard')"
                id="tab-guard"
                type="button"
                class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all role-tab text-slate-500 hover:text-slate-700">
                Guard
            </button>

            <button
                onclick="setRole('staff')"
                id="tab-staff"
                type="button"
                class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all role-tab text-slate-500 hover:text-slate-700">
                Staff
            </button>

        </div>

        <!-- Login Form -->
        <form id="auth-form" class="space-y-4">

            <div>
                <label
                    id="id-label"
                    class="block text-sm font-medium text-slate-700 mb-1">
                    Student ID
                </label>

                <input
                    type="text"
                    id="user-id"
                    required
                    placeholder="Enter your ID"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">
                    Passphrase
                </label>

                <input
                    type="password"
                    id="password"
                    required
                    placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>

            <!-- Error Message -->
            <div
                id="error-box"
                class="hidden p-3 rounded-lg bg-red-50 text-red-600 text-xs font-medium border border-red-100">
                Invalid credentials.
            </div>

            <!-- Success Message -->
            <div
                id="success-box"
                class="hidden p-3 rounded-lg bg-green-50 text-green-600 text-xs font-medium border border-green-100">
                Login successful.
            </div>

            <!-- Submit -->
            <button
                type="submit"
                class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-100 transition-all flex items-center justify-center gap-2 group">

                Authenticate Access

                <svg
                    class="w-5 h-5 group-hover:translate-x-1 transition-transform"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M13 7l5 5m0 0l-5 5m5-5H6">
                    </path>

                </svg>

            </button>

        </form>

        <p class="text-center text-xs text-slate-400 mt-6 uppercase tracking-widest font-semibold">
            Security Level: High
        </p>

    </div>

    <!-- Custom JavaScript -->
    <script src="./js/login.js"></script>

</body>
</html>
