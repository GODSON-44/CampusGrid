<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Ordering | Hostel Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: { 600: '#4f46e5', 700: '#4338ca' },
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 400: '#94a3b8', 600: '#475569', 800: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 1);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans p-4 md:p-8">

    <nav class="max-w-4xl mx-auto mb-8">
        <a href="./student.html" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 font-medium transition text-sm">
            &larr; Back to Dashboard
        </a>
        <div class="mt-4">
            <h1 class="text-3xl font-bold text-slate-800">Mess Ordering</h1>
            <p class="text-slate-600">Select items and generate a QR for the counter.</p>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-4" id="products-container">
            <!-- Products will be injected here -->
        </div>

        <div class="lg:col-span-1">
            <div id="cart-ui" class="sticky top-8 glass-card p-6 rounded-3xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-6">Your Cart</h2>
                <div id="cart-items" class="space-y-4 mb-6 max-h-60 overflow-y-auto custom-scrollbar">
                    <p class="text-slate-400 text-center text-sm py-4 italic">Your cart is empty</p>
                </div>
                <div id="cart-total" class="border-t border-slate-100 pt-4 font-bold text-lg flex justify-between items-center">
                    <span>Total</span>
                    <span class="text-indigo-600">₹0</span>
                </div>
                <div class="mt-6 flex flex-col gap-3">
                    <button id="btn-generate" disabled class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-semibold hover:bg-indigo-700 transition disabled:bg-slate-200 disabled:text-slate-400">Generate QR</button>
                    <button id="btn-clear" class="w-full text-slate-500 py-2 hover:text-slate-800 text-sm transition">Clear Cart</button>
                </div>
            </div>
        </div>
    </main>

    <div id="qr-modal" class="fixed inset-0 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div id="qrcode" class="flex justify-center mb-6"></div>
            <h3 class="text-xl font-bold mb-2">Show to Staff</h3>
            <p class="text-slate-500 mb-6 text-sm">Please keep this QR visible until confirmed.</p>
            <button id="btn-cancel" class="text-red-500 font-semibold text-sm hover:underline">Cancel Order</button>
        </div>
    </div>

    <script src="./js/order.js"></script>
</body>
</html>
